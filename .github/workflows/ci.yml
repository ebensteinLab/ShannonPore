name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10"]

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (fallback)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up conda environment via micromamba
        id: micromamba
        uses: mamba-org/setup-micromamba@v1
        continue-on-error: true
        with:
          environment-file: environment.yml
          environment-name: shannonpore
          cache-environment: true
          cache-downloads: true
          init-shell: bash

      - name: Fallback - install via pip if conda failed
        if: steps.micromamba.outcome != 'success'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ensure dev tools (ruff, black, pytest, pytest-cov) are present
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.15.12" "black==24.10.0" "pytest==8.3.3" "pytest-cov==5.0.0"

      - name: Install project (editable) into the active env
        run: |
          python -m pip install -e . || true

      - name: Lint with ruff
        run: ruff check shannonpore/ tests/ app.py

      - name: Format check with black
        run: black --check shannonpore/ tests/ app.py

      - name: Compile-check all Python sources
        run: |
          mapfile -t files < <(git ls-files 'shannonpore/**/*.py' 'app.py')
          if [ ${#files[@]} -eq 0 ]; then
            mapfile -t files < <(find shannonpore -name '*.py' -type f; echo app.py)
          fi
          python -m py_compile "${files[@]}"

      - name: Detect modkit availability
        id: modkit
        run: |
          if command -v modkit >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            modkit --version || true
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "modkit not found - integration tests requiring it will be skipped"
          fi

      - name: Run unit tests
        run: pytest tests/unit -v --cov=shannonpore --cov-report=term-missing --cov-report=xml:coverage-unit.xml

      - name: Run e2e tests
        run: pytest tests/e2e -v --cov=shannonpore --cov-append --cov-report=term-missing --cov-report=xml:coverage-e2e.xml

      - name: Run integration tests (only if modkit present)
        if: steps.modkit.outputs.available == 'true'
        run: pytest tests/integration -v -m 'not slow' --cov=shannonpore --cov-append --cov-report=term-missing --cov-report=xml:coverage-integration.xml

      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage summary" >> "$GITHUB_STEP_SUMMARY"
          python -m pip install coverage >/dev/null 2>&1 || true
          if [ -f .coverage ]; then
            python -m coverage report >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            coverage-*.xml
            .coverage
          if-no-files-found: ignore
