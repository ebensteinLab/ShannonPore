# High-level conda environment spec.
# After editing, regenerate the lockfile:
#   conda-lock lock -f environment.yml --lockfile conda-lock.yml
#
# Then `bash install.sh` reads conda-lock.yml for bit-for-bit reproducible
# installs. The lockfile pins exact builds across linux-64 / osx-arm64.
name: nanoentropy
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10.12
  - pip=24.2

  # External binaries
  # Note: the bioconda package is `ont-modkit` (the on-disk binary is still
  # `modkit`). v3 pinned `modkit=0.6.0` which doesn't exist as a recipe and
  # broke the env-create step.
  - ont-modkit=0.6.0
  - samtools=1.21
  - htslib=1.21

  # System libs
  - openssl
  - curl
  - zlib

  # Python packages installable from conda-forge (faster than pip)
  - numpy=1.26.4
  - pandas=2.2.3
  - scipy=1.11.4
  - matplotlib=3.8.4
  - seaborn=0.13.2
  - duckdb=1.4.3
  - tqdm=4.67.1
  - pyfaidx=0.8.1.2
  - pysam=0.22.1          # selftest + tests/fixtures/build_tiny_bam.py

  # GUI + CLI runtime — all available on conda-forge so we install them
  # via conda, not pip. (Earlier versions used a `pip:` block; that
  # block silently leaked installs into ~/.local on systems where
  # PYTHONUSERBASE was set, which then shadowed the conda env.)
  - streamlit=1.51.0
  - plotly=6.2.0

  # Dev / QA
  - pytest=8.3.3
  - pytest-cov=5.0.0
  - ruff=0.7.4
  - black=24.10.0
  - mypy=1.13.0
